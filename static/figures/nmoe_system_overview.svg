<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" role="img" aria-label="High-level nmoe system overview: config, trainer, core modules, metrics, NVIZ.">
<style>
  .t{font-family:GT America,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;fill:#494949}
  .m{font-family:JetBrains Mono,ui-monospace,Menlo,Consolas,monospace;fill:#494949}
  .muted{fill:#7c7c7c}
  .box{fill:#ffffff;stroke:#b8b1aa;stroke-width:1.2}
  .head{fill:#f7f3ef;stroke:#b8b1aa;stroke-width:1.2}
  .accent{stroke:#FF9101;stroke-width:2}
  .arrow{stroke:#6b6b6b;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b" />
  </marker>
</defs>

<text x="350" y="24" font-size="15" text-anchor="middle" class="t">nmoe: the smallest system that can be trusted</text>
<text x="350" y="42" font-size="12" text-anchor="middle" class="t muted">(one config path, deterministic resume, RDEP MoE dispatch, first-class metrics)</text>

<!-- Config -->
<rect x="30" y="76" width="130" height="74" rx="10" class="box"/>
<line x1="30" y1="76" x2="160" y2="76" class="accent"/>
<text x="95" y="108" font-size="12" text-anchor="middle" class="t">Config</text>
<text x="95" y="128" font-size="11" text-anchor="middle" class="m muted">configs/*.toml</text>

<!-- Arrow: Config -> Trainer -->
<path d="M 160 113 L 192 113" class="arrow"/>

<!-- Trainer -->
<rect x="192" y="76" width="150" height="74" rx="10" class="box"/>
<line x1="192" y1="76" x2="342" y2="76" class="accent"/>
<text x="267" y="108" font-size="12" text-anchor="middle" class="t">Trainer loop</text>
<text x="267" y="128" font-size="11" text-anchor="middle" class="m muted">python -m nmoe.train</text>

<!-- Arrow: Trainer -> Core modules -->
<path d="M 342 113 L 384 113" class="arrow"/>

<!-- Core modules group -->
<rect x="384" y="66" width="286" height="162" rx="12" class="box"/>
<rect x="384" y="66" width="286" height="34" rx="12" class="head"/>
<text x="527" y="88" font-size="12" text-anchor="middle" class="t">Core modules</text>

<rect x="400" y="112" width="120" height="44" rx="10" class="box"/>
<text x="460" y="139" font-size="11" text-anchor="middle" class="m">nmoe.data</text>

<rect x="536" y="112" width="120" height="44" rx="10" class="box"/>
<text x="596" y="139" font-size="11" text-anchor="middle" class="m">nmoe.model</text>

<rect x="400" y="170" width="120" height="44" rx="10" class="box"/>
<text x="460" y="197" font-size="11" text-anchor="middle" class="m">nmoe.rdep</text>

<rect x="536" y="170" width="120" height="44" rx="10" class="box"/>
<text x="596" y="197" font-size="11" text-anchor="middle" class="m">nmoe.opt</text>

<!-- Arrow: Trainer -> Metrics -->
<path d="M 267 150 L 267 192" class="arrow"/>

<!-- Metrics -->
<rect x="30" y="192" width="130" height="120" rx="10" class="box"/>
<line x1="30" y1="192" x2="160" y2="192" class="accent"/>
<text x="95" y="222" font-size="12" text-anchor="middle" class="t">Metrics</text>
<text x="95" y="244" font-size="11" text-anchor="middle" class="t muted">DuckDB per rank</text>
<text x="95" y="264" font-size="11" text-anchor="middle" class="t muted">SQLite experiments DB</text>
<text x="95" y="284" font-size="11" text-anchor="middle" class="t muted">NVTX + throughput</text>

<!-- Checkpoints -->
<rect x="192" y="192" width="150" height="60" rx="10" class="box"/>
<text x="267" y="218" font-size="12" text-anchor="middle" class="t">Checkpoints</text>
<text x="267" y="238" font-size="10" text-anchor="middle" class="t muted">dense/router + rank-local experts</text>

<!-- Arrow: Metrics -> NVIZ -->
<path d="M 160 252 L 384 290" class="arrow"/>

<!-- NVIZ -->
<rect x="384" y="264" width="286" height="60" rx="10" class="box"/>
<line x1="384" y1="264" x2="670" y2="264" class="accent"/>
<text x="527" y="290" font-size="12" text-anchor="middle" class="t">NVIZ</text>
<text x="527" y="308" font-size="11" text-anchor="middle" class="t muted">reads shared metrics + renders timelines</text>
</svg>
